# bubbler's audio policy for WirePlumber.
#
# Install as 50-bubbler.conf in one of
#   /usr/share/wireplumber/wireplumber.conf.d/
#   /etc/wireplumber/wireplumber.conf.d/
#   $XDG_CONFIG_HOME/wireplumber/wireplumber.conf.d/
# and restart the session manager. Without it a sandbox's audio grant is
# full access to every PipeWire node — microphone and every other
# client's audio reachable, and read, write, execute and metadata on
# each: the sandbox can also rename the session's sinks and sources and
# move its default device. Measured on WirePlumber 0.5.15, which hands
# every client it has no rule for the default permission manager, and
# that manager is Perm.ALL (`rwxml`), not the documented `rx`.
#
# bubbler gives each instance its own PipeWire security context whose
# properties reach the Client object, so the rules below match on
# bubbler's engine and on the grant the instance was launched with.
# The base rule matches the engine alone: an instance whose
# `bubbler.audio` value this file does not know still lands in the
# narrowest manager rather than falling through to the default one.
#
# This file needs scripts/bubbler/refuse-links.lua beside it, in
# /usr/share/wireplumber/scripts/ or $XDG_DATA_HOME/wireplumber/scripts/
# (`bubbler audio-policy --print --script` writes it). Permissions
# alone cannot say which links may be made, and without that hook a
# sandbox can record the sink's monitor ports — every other
# application's audio — under a plain playback grant.

access.rules = [
  {
    matches = [
      {
        pipewire.sec.engine = "org.bubbler"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "bubbler-playback"
      }
    }
  }
  {
    matches = [
      {
        pipewire.sec.engine = "org.bubbler"
        bubbler.audio = "playback,microphone"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "bubbler-playback-microphone"
      }
    }
  }
]

access.permission-managers = [
  # Playback. Read and execute on the graph, nothing writable and no
  # metadata permission anywhere, and no permission at all on the
  # objects below.
  #
  # Hiding a node does more than blind the sandbox to it: PW_PERM_L is
  # what lets a link be made to a node a client cannot see, and this
  # manager grants it nowhere, so the session manager's own attempt to
  # connect a capture stream to a source is refused by the daemon. That
  # is what keeps a playback-only sandbox off the microphone; visibility
  # alone would not, and the hook at the end of this file refuses the
  # same link a second time.
  {
    name = "bubbler-playback"
    default_permissions = "rx"
    core_permissions = "rx"
    rules = [
      {
        matches = [
          {
            media.class = "Audio/Source"
          }
        ]
        actions = {
          set-permissions = "-"
        }
      }
      # Every stream node, including the sandbox's own: a node carries
      # its client's id but none of the context properties, so no rule
      # here can tell one sandbox's stream from another's. Read, and
      # nothing else. Not hidden: the private pulse server a
      # `pulseaudio` grant runs creates a stream node per application
      # it serves and answers a client that asks for one it cannot see
      # with an invalid index, which makes `paplay` fail with a
      # protocol error. Not `x`, so no method can be called on another
      # client's stream, and not `l`, so no link can be made to one.
      {
        matches = [
          {
            media.class = "~Stream/.*"
          }
        ]
        actions = {
          set-permissions = "r"
        }
      }
      # The metadata objects carry the session's default sink and
      # source names and every stream's saved properties.
      {
        matches = [
          {
            metadata.name = "!null"
          }
        ]
        actions = {
          set-permissions = "-"
        }
      }
      # The session manager's own client, which holds every permission
      # there is.
      {
        matches = [
          {
            wireplumber.daemon = "true"
          }
        ]
        actions = {
          set-permissions = "-"
        }
      }
    ]
  }
  # Playback and microphone: the same, minus the rule that hides the
  # sources, so a capture stream may both see one and be linked to it.
  {
    name = "bubbler-playback-microphone"
    default_permissions = "rx"
    core_permissions = "rx"
    rules = [
      {
        matches = [
          {
            media.class = "~Stream/.*"
          }
        ]
        actions = {
          set-permissions = "r"
        }
      }
      {
        matches = [
          {
            metadata.name = "!null"
          }
        ]
        actions = {
          set-permissions = "-"
        }
      }
      {
        matches = [
          {
            wireplumber.daemon = "true"
          }
        ]
        actions = {
          set-permissions = "-"
        }
      }
    ]
  }
]

# The hook that refuses the links the managers above cannot: the
# script says which and why.
#
# It is `wants` of a required virtual feature rather than required
# itself, and that shape is what makes a half-installed policy
# survivable: measured on WirePlumber 0.5.15, a component a profile
# marks `required` whose script is missing stops the session manager
# from starting at all — no audio for the desktop, not just for a
# sandbox — while a wanted one is skipped with a line in the log. A
# feature the profile does not name is never loaded, `optional`
# included, so the entry below cannot be dropped.
#
# `base` is the profile block every shipped profile inherits, so this
# reaches `main` and every multi-instance profile alike.
wireplumber.components = [
  {
    name = bubbler/refuse-links.lua, type = script/lua
    provides = hooks.bubbler.refuse-links
    requires = [ hooks.linking.target.link ]
  }
  {
    type = virtual, provides = policy.bubbler
    wants = [ hooks.bubbler.refuse-links ]
  }
]

wireplumber.profiles = {
  base = {
    policy.bubbler = required
  }
}

[workspace]
resolver = "3"
members = ["crates/bubbler-core", "crates/bubbler"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/han-xyz/bubbler"

[workspace.dependencies]
bubbler-core = { path = "crates/bubbler-core" }
kdl = "6"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"

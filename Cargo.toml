[workspace]
resolver = "3"
members = ["crates/bubbler-core", "crates/bubbler", "crates/bubbler-init"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/han-xyz/bubbler"

[workspace.dependencies]
bubbler-core = { path = "crates/bubbler-core" }
bubbler-init = { path = "crates/bubbler-init" }
kdl = "6"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process", "net", "pipe", "event", "pty", "termios"] }
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
anyhow = "1"
signal-hook = "0.3"
libseccomp = "0.4"
tempfile = "3"

[workspace]
resolver = "3"
members = [
    "crates/bubbler-core",
    "crates/bubbler",
    "crates/bubbler-init",
    "crates/bubbler-wl-proxy",
    "crates/bubbler-net-proxy",
    "crates/bubbler-ui",
]
# The fuzz targets link against libFuzzer and need a nightly compiler,
# which the four checks do not have; building them is a separate,
# manual step.
exclude = ["fuzz"]

[workspace.package]
version = "0.20.0"
edition = "2024"
# `kdl` 6 declares 1.95; everything else in the locked graph is older.
# Pinned so a too-old toolchain says so once instead of failing to parse.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/han-xyz/bubbler"

[workspace.dependencies]
# `version` beside `path`: crates.io refuses a bare path dependency, and
# `cargo deny` reads one as a wildcard requirement.  Bumped with
# `workspace.package.version` at each release.
bubbler-core = { path = "crates/bubbler-core", version = "0.20.0" }
bubbler-init = { path = "crates/bubbler-init", version = "0.20.0" }
bubbler-net-proxy = { path = "crates/bubbler-net-proxy", version = "0.20.0" }
kdl = "6"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process", "net", "pipe", "event", "pty", "termios", "thread", "rand"] }
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
anyhow = "1"
signal-hook = "0.3"
libseccomp = "0.4"
wayrs-client = "1"
wayrs-protocols = { version = "0.14", features = ["security-context-v1"] }
# Display width of a string, for the columns a node is shortened to fit.
# Already in the tree through ratatui; the East-Asian width tables it
# carries are not worth hand-rolling.
unicode-width = "0.2"
# Build-time only: the wl-proxy generates its interface tables from the XML
# the wayrs crates ship, so the tables track the versions Cargo.lock pins.
wayrs-proto-parser = "3"
tempfile = "3"
proptest = "1"

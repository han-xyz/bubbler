[package]
name = "bubbler-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Library core of bubbler: config model, services, bwrap argument builder, launcher"

[dependencies]
bubbler-init.workspace = true
kdl.workspace = true
thiserror.workspace = true
# `stdio` for the last-run log, which points fd 2 at a file for a run
# nobody is watching a terminal for.
rustix = { workspace = true, features = ["stdio"] }
signal-hook.workspace = true
libseccomp.workspace = true
# Wayland client in pure Rust, no libwayland: the security-context
# handshake is six requests, but the wire format with its fd passing is
# not worth hand-rolling.
wayrs-client.workspace = true
wayrs-protocols.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Property tests over generated configs and include graphs: hand-rolled
# generators would be a worse shrinker than proptest's.
proptest.workspace = true

[package]
name = "bubbler-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Library core of bubbler: config model, services, bwrap argument builder, launcher"

[dependencies]
bubbler-init.workspace = true
kdl.workspace = true
thiserror.workspace = true
rustix.workspace = true
signal-hook.workspace = true
libseccomp.workspace = true

[dev-dependencies]
# `stdio` is only ever used to quiet fd 2 while a test makes the relay
# report a destination that refuses its output.
rustix = { workspace = true, features = ["stdio"] }
tempfile.workspace = true

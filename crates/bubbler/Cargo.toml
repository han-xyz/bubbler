[package]
name = "bubbler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "bubblewrap-based application sandbox with instances and resource services"

[dependencies]
bubbler-core.workspace = true
clap.workspace = true
clap_mangen.workspace = true
anyhow.workspace = true
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `thread` for `unshare(2)`: the probes prove a user namespace can be made
# here by making one. `stdio` to write a skip reason to descriptor 2 past
# libtest's capture. Neither is a feature the binary itself needs.
rustix = { workspace = true, features = ["thread", "stdio"] }

[package]
name = "bubbler-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Run layer of bubbler: the launcher and every host effect"

[dependencies]
bubbler-init.workspace = true
bubbler-model.workspace = true
bubbler-plan.workspace = true
thiserror.workspace = true
# `stdio` for the last-run log, which points fd 2 at a file for a run
# nobody is watching a terminal for.
rustix = { workspace = true, features = ["stdio"] }
signal-hook.workspace = true
# Wayland client in pure Rust, no libwayland: the security-context
# handshake is six requests, but the wire format with its fd passing is
# not worth hand-rolling.
wayrs-client.workspace = true
wayrs-protocols.workspace = true
libc.workspace = true

[dev-dependencies]
bubbler-model = { workspace = true, features = ["test-support"] }
bubbler-plan = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[package]
name = "bubbler-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Model layer of bubbler: config, profiles, instances and their errors"

[features]
# Test helpers (`profile::test_support`) for the higher crates' tests;
# never enabled in a normal build.
test-support = []

[dependencies]
# The `HostPattern` rule an `allow-host` is parsed by is the same one
# the egress proxy holds a `CONNECT` target to; core takes it from the
# proxy's library rather than keeping a second copy of a filter rule.
bubbler-net-proxy.workspace = true
kdl.workspace = true
thiserror.workspace = true
rustix.workspace = true
libseccomp.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
